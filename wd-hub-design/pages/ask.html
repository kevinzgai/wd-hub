<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06 提问</title>
    <style id="theme-vars">
:root {
  /* Official passport-os travel palette, unchanged hue family. */
  --wd-background: #181B1C;
  --wd-foreground: #EEE7D6;
  --wd-card: #202526;
  --wd-card-foreground: #EEE7D6;
  --wd-primary: #DDB36C;
  --wd-primary-foreground: #181B1C;
  --wd-muted: #303738;
  --wd-muted-foreground: #B3B2A5;
  --wd-border: #59605D;
  --wd-input: #303738;
  --wd-ring: #DDB36C;
  --wd-destructive: #F09B87;
  --wd-destructive-foreground: #181B1C;

  /* Real semantic states only. */
  --state-success: #9DB89A;
  --state-warning: #DDB36C;
  --state-error: #F09B87;
  --state-info: #B3B2A5;

  /* Pixel geometry tokens. */
  --wd-radius-sm: 0px;
  --wd-radius-md: 4px;
  --wd-radius-lg: 6px;

  --wd-font-cjk: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --wd-font-num: "Montserrat", "DIN Alternate", "Helvetica Neue", Arial, sans-serif;
  --wd-font-command: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}

/* ---------- Device board ---------- */
.board {
  width: 240px;
  height: 320px;
  position: relative;
  overflow: hidden;
  background: var(--wd-background);
  color: var(--wd-foreground);
  font-family: var(--wd-font-cjk);
  font-size: 16px;
  line-height: 20px;
  letter-spacing: 0;
  -webkit-font-smoothing: none;
  font-smooth: never;
}

.board *,
.board *::before,
.board *::after {
  box-sizing: border-box;
}

.abs {
  position: absolute;
}

/* ---------- Header 0..32 ---------- */
.hd {
  position: absolute;
  left: 0;
  top: 0;
  width: 240px;
  height: 32px;
  background: var(--wd-muted);
  border-bottom: 1px solid var(--wd-border);
  display: flex;
  align-items: center;
  padding: 0 6px;
}

.hd-idx {
  width: 22px;
  height: 18px;
  flex: 0 0 22px;
  background: var(--wd-primary);
  color: var(--wd-primary-foreground);
  font-size: 16px;
  line-height: 18px;
  text-align: center;
  font-family: var(--wd-font-num);
}

.hd-title {
  margin-left: 6px;
  color: var(--wd-foreground);
  font-size: 16px;
  line-height: 20px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.hd-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  color: var(--wd-muted-foreground);
  font-size: 16px;
  line-height: 20px;
  white-space: nowrap;
}

.hd-meta.is-ok {
  color: var(--state-success);
}

.hd-meta.is-warn {
  color: var(--state-warning);
}

.hd-meta.is-danger {
  color: var(--state-error);
}

/* ---------- Footer 294..316 ---------- */
.ft {
  position: absolute;
  left: 4px;
  top: 294px;
  width: 232px;
  height: 22px;
  background: var(--wd-card);
  border: 1px solid var(--wd-border);
  border-radius: var(--wd-radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--wd-muted-foreground);
  font-size: 16px;
  line-height: 16px;
  white-space: nowrap;
}

.ft .on {
  color: var(--wd-primary);
}

/* ---------- Content primitives ---------- */
.card {
  background: var(--wd-card);
  border: 1px solid var(--wd-border);
  border-radius: var(--wd-radius-md);
}

.card.rail-primary {
  border-left: 3px solid var(--wd-primary);
}

.card.rail-danger {
  border-left: 3px solid var(--state-error);
}

.card.rail-success {
  border-left: 3px solid var(--state-success);
}

.label {
  color: var(--wd-muted-foreground);
  font-size: 16px;
  line-height: 20px;
  white-space: nowrap;
}

.label.on {
  color: var(--wd-primary);
}

.num16 {
  font-family: var(--wd-font-cjk);
  font-size: 16px;
  line-height: 16px;
  font-variant-numeric: tabular-nums;
}

.label.strong {
  color: var(--wd-foreground);
}

.num {
  font-family: var(--wd-font-num);
  font-size: 32px;
  line-height: 32px;
  font-weight: 500;
  letter-spacing: -0.5px;
  color: var(--wd-primary);
}

.num.ink {
  color: var(--wd-foreground);
}

.num.danger {
  color: var(--state-error);
}

.rule {
  background: var(--wd-border);
  height: 1px;
}

.dot {
  width: 4px;
  height: 4px;
  flex: 0 0 4px;
  background: var(--wd-muted-foreground);
  display: inline-block;
  margin-right: 5px;
}

.dot.ok { background: var(--state-success); }
.dot.warn { background: var(--state-warning); }
.dot.err { background: var(--state-error); }
.dot.idle { background: var(--wd-muted-foreground); }

/* ---------- Progress / usage bars ---------- */
.bar {
  position: relative;
  height: 8px;
  background: var(--wd-muted);
  border: 1px solid var(--wd-border);
}

.bar > i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  display: block;
  background: var(--wd-primary);
}

.bar.thin {
  height: 6px;
}

/* ---------- Option rows ---------- */
.opt {
  display: flex;
  align-items: center;
  background: var(--wd-card);
  border: 1px solid var(--wd-border);
  color: var(--wd-foreground);
  font-size: 16px;
  line-height: 16px;
  padding: 0 6px;
}

.opt.sel {
  background: var(--wd-primary);
  border-color: var(--wd-primary);
  color: var(--wd-primary-foreground);
}

.opt-key {
  width: 16px;
  flex: 0 0 16px;
  font-family: var(--wd-font-num);
  font-size: 16px;
  line-height: 16px;
  color: var(--wd-muted-foreground);
}

.opt.sel .opt-key {
  color: var(--wd-primary-foreground);
}

.opt-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.opt-mark {
  margin-left: auto;
  width: 4px;
  height: 4px;
  flex: 0 0 4px;
  background: var(--wd-primary);
}

.opt.sel .opt-mark {
  background: var(--wd-background);
}

/* ---------- Command lines ---------- */
.cmd {
  font-family: var(--wd-font-command);
  font-size: 16px;
  line-height: 20px;
  color: var(--wd-foreground);
}

.cmdline {
  display: flex;
  align-items: baseline;
  white-space: nowrap;
}

.cmdline .ln {
  width: 22px;
  flex: 0 0 22px;
  color: var(--wd-muted-foreground);
}

.cmdline .tx {
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- Action blocks ---------- */
.act {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  line-height: 16px;
  border: 1px solid transparent;
  white-space: nowrap;
}

.act.allow {
  background: var(--state-success);
  border-color: var(--state-success);
  color: var(--wd-primary-foreground);
}

.act.deny {
  background: var(--state-error);
  border-color: var(--state-error);
  color: var(--wd-primary-foreground);
}

.act.quiet {
  background: var(--wd-card);
  border-color: var(--wd-border);
  color: var(--wd-muted-foreground);
}

/* ---------- Standby ---------- */
.clock {
  font-family: var(--wd-font-num);
  font-size: 32px;
  line-height: 32px;
  font-weight: 500;
  letter-spacing: 1px;
  color: var(--wd-primary);
}

.brand {
  font-family: var(--wd-font-num);
  font-size: 16px;
  line-height: 16px;
  letter-spacing: 4px;
  color: var(--wd-muted-foreground);
}

.standby-hint {
  color: var(--wd-muted-foreground);
  font-size: 16px;
  line-height: 16px;
  text-align: center;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

<body class="min-h-screen font-sans antialiased" style="margin:0;background:var(--wd-background);display:flex;justify-content:center;align-items:flex-start;">
    <main style="width:240px;height:320px;flex:0 0 240px;">
      <div class="board">
        <header class="hd">
          <span class="hd-idx">6</span>
          <span class="hd-title">提问</span>
          <span class="hd-meta is-danger">必答</span>
        </header>

        <section class="card rail-primary abs" style="left:4px;top:38px;width:232px;height:94px;">
          <div class="abs" style="left:8px;right:8px;top:6px;height:20px;display:flex;align-items:center;">
            <span class="num16" style="color:var(--wd-primary);">Claude Code</span>
            <span class="label" style="margin-left:auto;">Q1</span>
          </div>
          <div class="abs" style="left:8px;right:8px;top:28px;font-size:16px;line-height:20px;">
            补丁已生成，是否直接写入主分支？
          </div>
          <div class="abs label" style="left:8px;top:70px;">影响 3 个文件 · 不可撤销</div>
        </section>

        <div class="opt abs" style="left:4px;top:138px;width:232px;height:22px;">
          <span class="opt-key">A</span><span class="opt-text">写入并提交</span><i class="opt-mark"></i>
        </div>
        <div class="opt sel abs" style="left:4px;top:162px;width:232px;height:22px;">
          <span class="opt-key">B</span><span class="opt-text">仅写入工作区</span><i class="opt-mark"></i>
        </div>
        <div class="opt abs" style="left:4px;top:186px;width:232px;height:22px;">
          <span class="opt-key">C</span><span class="opt-text">生成补丁文件</span><i class="opt-mark"></i>
        </div>
        <div class="opt abs" style="left:4px;top:210px;width:232px;height:22px;">
          <span class="opt-key">D</span><span class="opt-text">取消本次操作</span><i class="opt-mark"></i>
        </div>
        <div class="opt abs" style="left:4px;top:234px;width:232px;height:22px;">
          <span class="opt-key">E</span><span class="opt-text">先运行测试</span><i class="opt-mark"></i>
        </div>
        <div class="opt abs" style="left:4px;top:258px;width:232px;height:22px;">
          <span class="opt-key">F</span><span class="opt-text">交给其他代理</span><i class="opt-mark"></i>
        </div>

        <footer class="ft"><span class="on">OK</span>&nbsp;下项&nbsp;&nbsp;·&nbsp;&nbsp;长↓ 提交</footer>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
