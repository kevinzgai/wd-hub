<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>连接 WORKBUDDY 看板</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#11151c; --panel2:#0b0d11;
    --line:#1e2734; --line2:#2a3546;
    --txt:#e8eef7; --muted:#93a2b8; --dim:#64748b;
    --accent:#22d3ee; --accent2:#67e8f9; --accent-ink:#04222a;
    --err:#fb7185; --ok:#34d399; --warn:#fbbf24;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.55;
    display:flex; flex-direction:column; justify-content:center;
    padding:24px 20px; gap:18px;
    background-image:
      radial-gradient(600px 300px at 12% -10%, rgba(34,211,238,.10), transparent 70%),
      radial-gradient(520px 260px at 92% 0%, rgba(129,140,248,.08), transparent 72%);
    -webkit-tap-highlight-color:transparent;
  }
  .head{ display:flex; align-items:center; gap:10px; }
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 12px rgba(34,211,238,.8);
  }
  h1{ font-size:19px; font-weight:600; letter-spacing:.2px; }
  .sub{ color:var(--muted); font-size:12.5px; }
  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r); padding:16px;
    display:flex; flex-direction:column; gap:12px;
  }
  label{ font-size:12px; color:var(--muted); }
  input{
    width:100%; background:var(--panel2); color:var(--txt);
    border:1px solid var(--line2); border-radius:10px;
    padding:13px 14px; font-size:16px; font-family:ui-monospace,monospace;
    outline:none;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,211,238,.14); }
  button{
    width:100%; border:0; border-radius:10px; padding:14px;
    font-size:15px; font-weight:600; cursor:pointer;
    background:var(--accent); color:var(--accent-ink);
  }
  button:active{ opacity:.82; }
  button.ghost{
    background:transparent; color:var(--muted);
    border:1px solid var(--line2); font-weight:400; font-size:13px; padding:11px;
  }
  .msg{
    display:none; font-size:12.5px; border-radius:10px; padding:10px 12px;
    background:rgba(251,113,133,.12); color:var(--err);
    border:1px solid rgba(251,113,133,.28); white-space:pre-wrap; word-break:break-all;
  }
  .msg.show{ display:block; }
  .msg.ok{ background:rgba(52,211,153,.12); color:var(--ok); border-color:rgba(52,211,153,.28); }
  ol{ padding-left:18px; color:var(--muted); font-size:12.5px; display:flex; flex-direction:column; gap:6px; }
  code{
    font-family:ui-monospace,monospace; color:var(--accent2);
    background:rgba(34,211,238,.10); padding:1px 5px; border-radius:4px; font-size:12px;
  }
  .foot{ color:var(--dim); font-size:11.5px; text-align:center; line-height:1.7; }
</style>
</head>
<body>

  <div class="head">
    <span class="dot"></span>
    <div>
      <h1>WORKBUDDY 看板</h1>
      <div class="sub">连接电脑上的本地服务</div>
    </div>
  </div>

  <div class="card">
    <div>
      <label for="url">电脑地址（IP 或 IP:端口）</label>
    </div>
    <input id="url" type="text" inputmode="url" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="192.168.1.10:8000">
    <button onclick="connect()">连接</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <ol>
      <li>在电脑上启动 <code>wb_app.py</code>，控制台会打印监听地址</li>
      <li>手机和电脑连<b>同一个 WiFi</b></li>
      <li>电脑 IP 用 <code>ipconfig</code> 查，或看启动日志</li>
      <li>连不上多半是 Windows 防火墙拦了 <code>8000</code> 端口</li>
    </ol>
    <button class="ghost" onclick="reset()">清除已保存的地址</button>
  </div>

  <div class="foot">
    长按返回键可随时回到这里改地址
  </div>

<script>
  var q = new URLSearchParams(location.search);
  var msgEl = document.getElementById('msg');
  var input = document.getElementById('url');

  var cur = q.get('cur');
  if (cur) input.value = cur;

  var m = q.get('msg');
  if (m) { msgEl.textContent = m; msgEl.classList.add('show'); }

  function connect() {
    var v = input.value.trim();
    if (!v) { input.focus(); return; }
    location.href = 'wbboard://save?url=' + encodeURIComponent(v);
  }

  function reset() {
    location.href = 'wbboard://reset';
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') connect();
  });
</script>
</body>
</html>
